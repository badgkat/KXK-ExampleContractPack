// ============================================================================
// KCK Feature: CAMPAIGN_CHAPTER
//
// Demonstrates:
//   - Two chapters with numeric ids (enables ChapterAtLeast ordering)
//   - ENTRY_TRIGGER referencing trigger ids defined in triggers.cfg
//   - name and description fields
//
// KCK Feature: REPUTATION_INCOME
//
// Demonstrates:
//   - Tiered passive income paid every intervalDays
//   - Two TIERs with min/max reputation ranges, income amounts, and labels
//
// KCK Feature: REPUTATION_DECAY
//
// Demonstrates:
//   - Percentage-based reputation decay over time
//   - resetOnContractComplete pauses decay after contract success
//   - tierFloors prevents decay below highest tier ever reached
// ============================================================================

// --- Chapter 1: starts on new game ---
CAMPAIGN_CHAPTER
{
	id = 1
	name = Ground Operations
	description = The program begins. Prove you can launch a vehicle.
	ENTRY_TRIGGER = kxk_ch1_entry
}

// --- Chapter 2: triggered by completing the first contract ---
CAMPAIGN_CHAPTER
{
	id = 2
	name = Orbital Operations
	description = Time to reach orbit. The sky is no longer the limit.
	ENTRY_TRIGGER = kxk_ch2_entry
}

// --- Reputation Income ---
// Pays funds every 30 days based on current reputation tier.
// Tier ranges must not overlap or have gaps.
REPUTATION_INCOME
{
	enabled = true
	intervalDays = 30

	TIER
	{
		min = 0
		max = 100
		income = 5000
		label = Startup
	}

	TIER
	{
		min = 100
		max = 9999
		income = 15000
		label = Established
	}
}

// --- Reputation Decay ---
// Reputation slowly decays if no contracts are completed.
// tierFloors = true means rep won't fall below the min of the highest tier reached.
REPUTATION_DECAY
{
	enabled = true
	ratePercentPerMonth = 2.0
	resetOnContractComplete = true
	tierFloors = true
}
