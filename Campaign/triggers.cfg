// ============================================================================
// KCK Feature: CAMPAIGN_TRIGGER
//
// Demonstrates:
//   - once = true (fire once, persisted across saves)
//   - once = false (repeating trigger)
//   - ON_EVENT types: FacilityEntered, ContractComplete, ChapterEntered,
//     SceneChoiceMade
//   - WHEN block with flagExpression guard
//   - ACTIONS: SET_FLAG, ENQUEUE_SCENE (Immediate and OnFacilityEnter),
//     ADVANCE_CHAPTER, ADJUST_REPUTATION, ADJUST_FUNDS, ADJUST_SCIENCE,
//     NOTIFY, CLEAR_NOTIFICATION
// ============================================================================

// --- Trigger 1: Chapter 1 Entry ---
// Fires once when the player first enters the Space Center.
// Queues the welcome dialogue immediately and posts a notification.
CAMPAIGN_TRIGGER
{
	id = kxk_ch1_entry
	once = true

	ON_EVENT
	{
		type = FacilityEntered
		facility = SpaceCenter
	}

	ACTIONS
	{
		// Must explicitly enter chapter 1 — KCK starts with no chapter set
		ADVANCE_CHAPTER
		{
			target = 1
		}

		// ENQUEUE_SCENE with when = Immediate plays the scene right away
		ENQUEUE_SCENE
		{
			sceneId = kxk_example_welcome
			when = Immediate
		}

		SET_FLAG
		{
			name = kxk_started
			value = true
		}

		// NOTIFY creates a hierarchical notification.
		// target = dot-separated path (here just "admin")
		// severity = Info or Action
		// source = unique identifier for clearing later
		NOTIFY
		{
			target = admin
			severity = Info
			source = kxk_welcome
		}
	}
}

// --- Trigger 2: Advance to Chapter 2 ---
// Fires when the DemoLaunch contract is completed.
// Advances the chapter and awards bonus funds + reputation.
CAMPAIGN_TRIGGER
{
	id = kxk_ch2_advance
	once = true

	ON_EVENT
	{
		type = ContractComplete
		contract = KXK_DemoLaunch
	}

	ACTIONS
	{
		ADVANCE_CHAPTER
		{
			target = 2
		}

		ADJUST_REPUTATION
		{
			amount = 25
		}

		ADJUST_FUNDS
		{
			amount = 10000
		}
	}
}

// --- Trigger 3: Chapter 2 Entry Scene ---
// Fires when chapter 2 is entered (by Trigger 2's ADVANCE_CHAPTER).
// Queues dialogue for next Space Center visit and sets flags for KIK and memos.
CAMPAIGN_TRIGGER
{
	id = kxk_ch2_entry
	once = true

	ON_EVENT
	{
		type = ChapterEntered
		chapter = 2
	}

	ACTIONS
	{
		// ENQUEUE_SCENE with when = OnFacilityEnter defers playback
		// until the player enters the specified facility
		ENQUEUE_SCENE
		{
			sceneId = kxk_example_chapter2
			when = OnFacilityEnter
			facility = SpaceCenter
		}

		SET_FLAG
		{
			name = kxk_orbit_phase
			value = true
		}

		// This flag connects KCK triggers to KIK's onFlag lesson trigger
		SET_FLAG
		{
			name = orbit_training
			value = true
		}

		// CLEAR_NOTIFICATION removes a notification by target + source
		CLEAR_NOTIFICATION
		{
			target = admin
			source = kxk_welcome
		}
	}
}

// --- Trigger 4: Choice Reaction ---
// Fires when the player picks "science" in the welcome dialogue.
// Uses WHEN block to gate on the flag value, and SceneChoiceMade event.
CAMPAIGN_TRIGGER
{
	id = kxk_choice_reaction
	once = true

	// SceneChoiceMade fires when a CHOICE is resolved in a KDK scene
	ON_EVENT
	{
		type = SceneChoiceMade
		sceneId = kxk_example_welcome
		choiceId = approach
	}

	// WHEN block: flagExpression guard — trigger only fires if expression is true
	WHEN
	{
		flagExpression = approach == science
	}

	ACTIONS
	{
		ADJUST_SCIENCE
		{
			amount = 10
		}

		SET_FLAG
		{
			name = science_bonus
			value = true
		}
	}
}

// --- Trigger 5: Repeating Facility Greeting ---
// Fires EVERY TIME (once = false) the player enters the Administration building.
// WHEN guard ensures it only fires after the program has started.
CAMPAIGN_TRIGGER
{
	id = kxk_facility_greet
	once = false

	ON_EVENT
	{
		type = FacilityEntered
		facility = Administration
	}

	WHEN
	{
		flagExpression = kxk_started == true
	}

	ACTIONS
	{
		// clearOn = FacilityEntered means this notification auto-clears
		// when the player leaves and re-enters a facility
		NOTIFY
		{
			target = admin.greet
			severity = Info
			source = kxk_admin_visit
			clearOn = FacilityEntered
		}
	}
}
