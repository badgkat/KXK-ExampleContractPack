// ============================================================================
// ContractConfigurator CONTRACT_TYPE with multiple KCK requirements
//
// Demonstrates:
//   - KCK REQUIREMENT: ChapterAtLeast (numeric chapter ordering)
//   - KCK REQUIREMENT: FlagEquals (exact flag value match)
//   - KCK REQUIREMENT: FlagExpression (complex boolean expression)
//   - KCK REQUIREMENT: ReputationMinimum (reputation threshold)
//   - KCK BEHAVIOUR: ReputationStake
//   - All requirements must be true for the contract to appear
// ============================================================================

CONTRACT_TYPE
{
	name = KXK_DemoOrbit
	group = KXK_Examples

	title = Example: First Orbit
	genericTitle = Example: First Orbit
	description = Reach Kerbin orbit. This contract demonstrates multiple KCK requirement types working together.
	synopsis = Achieve orbit around Kerbin.
	completedMessage = Orbit achieved. The stars await.

	prestige = Significant
	targetBody = HomeWorld()
	maxCompletions = 1

	rewardFunds = 30000
	rewardReputation = 10
	rewardScience = 5
	failureFunds = 5000
	advanceFunds = 10000

	PARAMETER
	{
		name = ReachOrbit
		type = ReachState
		situation = ORBITING
		title = Achieve orbit around Kerbin
	}

	// --- KCK REQUIREMENT: ChapterAtLeast ---
	// True when campaign chapter >= 2
	REQUIREMENT
	{
		name = ChapterReq
		type = ChapterAtLeast
		chapter = 2
	}

	// --- KCK REQUIREMENT: FlagEquals ---
	// True when the named flag has the exact specified value.
	// Note: "name" serves double duty as CC requirement name AND flag name.
	REQUIREMENT
	{
		name = kxk_orbit_phase
		type = FlagEquals
		value = true
	}

	// --- KCK REQUIREMENT: FlagExpression ---
	// Evaluates a boolean expression against KDK flags
	// Supports: ==, !=, &&, ||, parentheses
	REQUIREMENT
	{
		name = FlagExprReq
		type = FlagExpression
		expression = kxk_started == true && approach != ""
	}

	// --- KCK REQUIREMENT: ReputationMinimum ---
	// True when player reputation >= value
	REQUIREMENT
	{
		name = RepReq
		type = ReputationMinimum
		value = 10
	}

	BEHAVIOUR
	{
		name = RepStake
		type = ReputationStake
		successBonus = 30.0
		failurePenalty = 15.0
	}
}
