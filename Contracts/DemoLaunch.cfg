// ============================================================================
// ContractConfigurator CONTRACT_GROUP + CONTRACT_TYPE
//
// Demonstrates:
//   - CONTRACT_GROUP definition (groups contracts in Mission Control)
//   - Basic CONTRACT_TYPE with standard fields
//   - PARAMETER: ReachState (altitude check)
//   - KCK REQUIREMENT: InChapter (exact chapter match)
//   - KCK BEHAVIOUR: ReputationStake (bonus on success, penalty on failure)
// ============================================================================

CONTRACT_GROUP
{
	name = KXK_Examples
	displayName = KXK Examples
	agent = KXK Examples

	tip = Demonstrating KXK toolkit features...
	minVersion = 1.15.0
}

CONTRACT_TYPE
{
	name = KXK_DemoLaunch
	group = KXK_Examples

	title = Example: First Launch
	genericTitle = Example: First Launch
	description = Launch a vessel above 10 km altitude. This contract demonstrates the InChapter requirement and ReputationStake behaviour.
	synopsis = Reach 10 km altitude with any vessel.
	completedMessage = Launch successful. The program advances.

	prestige = Trivial
	targetBody = HomeWorld()
	maxCompletions = 1

	rewardFunds = 15000
	rewardReputation = 5
	rewardScience = 0
	failureFunds = 0
	advanceFunds = 5000

	PARAMETER
	{
		name = ReachAlt
		type = ReachState
		minAltitude = 10000
		title = Reach 10 km altitude
	}

	// --- KCK REQUIREMENT: InChapter ---
	// Contract only available when campaign is in exactly chapter 1
	REQUIREMENT
	{
		name = InChapter1
		type = InChapter
		chapter = 1
	}

	// --- KCK BEHAVIOUR: ReputationStake ---
	// Awards extra reputation on success, penalizes on failure
	// (on top of the standard rewardReputation above)
	BEHAVIOUR
	{
		name = RepStake
		type = ReputationStake
		successBonus = 15.0
		failurePenalty = 10.0
	}
}
