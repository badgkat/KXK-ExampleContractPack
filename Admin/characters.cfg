// ============================================================================
// KAK Feature: DIRECTOR_CHARACTER
//
// Demonstrates:
//   - id, displayName, role, baseColor, instructorModel
//   - dispositionFlag (reads disposition from KDK flag store)
//   - defaultDisposition (fallback when flag is unset)
//   - onClickScene (fires KDK dialogue when chip clicked, no focuses active)
//   - CHIP_LAYER (layered visual composition on character chip)
//   - DISPOSITION_TINT (override color for specific dispositions)
//   - DISPOSITION_LABEL (override label text for specific dispositions)
//
// KAK Feature: DIRECTOR_FOCUS
//
// Demonstrates:
//   - character assignment, id, title, description
//   - flag + flagValue (writes to KDK flag store on selection)
//   - requirement (flag expression gating focus availability)
//
// KAK Feature: DISPOSITION_DECAY
//
// Demonstrates:
//   - Automatic disposition transitions over time
//   - stepDays (in-game days between transitions)
//   - STEP nodes defining from -> to transitions
// ============================================================================

// =====================================================================
// Character: Alice — Program Director
// =====================================================================

DIRECTOR_CHARACTER
{
	id = alice
	displayName = Alice Kerman
	role = Program Director

	// baseColor is the default chip tint — hex RGB
	baseColor = #3366CC

	// instructorModel loads a KSP instructor portrait for the Character Panel
	instructorModel = Instructor_Wernher

	// dispositionFlag names the KDK flag that stores this character's mood
	// KCK triggers can SET_FLAG to change disposition at runtime
	dispositionFlag = alice_disposition

	// defaultDisposition is used when the flag has no value yet
	defaultDisposition = Supportive

	// onClickScene fires this KDK dialogue when the chip is clicked
	// (only used when the character has no valid focuses to pick from)
	onClickScene = kxk_example_welcome

	// --- CHIP_LAYER: layered visual composition ---
	// Layers render in order (first = back). Each layer can be independently
	// tinted by disposition if tintWithDisposition = true.
	CHIP_LAYER
	{
		// When no textureUrl, renders as solid color rect using baseColor
		tintWithDisposition = true
	}

	CHIP_LAYER
	{
		textureUrl = KXK-ExampleContractPack/Textures/badgkat_icon
		rect = 0.1, 0.1, 0.8, 0.8
		tintWithDisposition = false
	}

	// --- DISPOSITION_TINT: override color for specific dispositions ---
	// Without overrides, colors are computed algorithmically from baseColor
	DISPOSITION_TINT
	{
		value = Enthusiastic
		color = #4488FF
	}

	DISPOSITION_TINT
	{
		value = Frustrated
		color = #993333
	}

	// --- DISPOSITION_LABEL: override displayed label text ---
	// Without overrides, the disposition name itself is shown
	DISPOSITION_LABEL
	{
		value = Enthusiastic
		text = Thrilled
	}

	DISPOSITION_LABEL
	{
		value = Frustrated
		text = Annoyed
	}
}

// =====================================================================
// Character: Bob — Lead Engineer
// =====================================================================

DIRECTOR_CHARACTER
{
	id = bob
	displayName = Bob Kerman
	role = Lead Engineer
	baseColor = #CC6633
	instructorModel = Instructor_Gene
	dispositionFlag = bob_disposition
	defaultDisposition = Neutral
	onClickScene = kxk_example_chapter2

	// Single chip layer — just the base color, tinted by disposition
	CHIP_LAYER
	{
		tintWithDisposition = true
	}
}

// =====================================================================
// Focuses — Alice
// =====================================================================

// Focus with no requirement gate — always available
DIRECTOR_FOCUS
{
	character = alice
	id = alice_science
	title = Science Programs
	description = Alice focuses the program on scientific research and data collection.

	// flag + flagValue: selecting this focus writes flagValue to the named flag
	flag = alice_focus
	flagValue = science
}

// Focus with a requirement gate — only available if the approach flag matches
DIRECTOR_FOCUS
{
	character = alice
	id = alice_exploration
	title = Exploration Programs
	description = Alice focuses the program on pushing boundaries and exploration.
	flag = alice_focus
	flagValue = exploration

	// requirement uses KDK flag expression syntax
	// This focus only appears in the picker if the player chose exploration or balanced
	requirement = approach == exploration || approach == balanced
}

// =====================================================================
// Focuses — Bob
// =====================================================================

DIRECTOR_FOCUS
{
	character = bob
	id = bob_vehicles
	title = Vehicle Design
	description = Bob focuses on designing and testing vehicles.
	flag = bob_focus
	flagValue = vehicles
}

// Focus gated on chapter 2 flag
DIRECTOR_FOCUS
{
	character = bob
	id = bob_missions
	title = Mission Planning
	description = Bob focuses on planning orbital missions.
	flag = bob_focus
	flagValue = missions

	// Only available after chapter 2 begins
	requirement = kxk_orbit_phase == true
}

// =====================================================================
// Disposition Decay — automatic mood transitions over time
// =====================================================================

// Alice decays from Enthusiastic -> Supportive -> Neutral over time
DISPOSITION_DECAY
{
	character = alice

	// stepDays = in-game days between each transition
	stepDays = 60

	// STEP defines a single transition: if current = from, after stepDays -> to
	STEP
	{
		from = Enthusiastic
		to = Supportive
	}

	STEP
	{
		from = Supportive
		to = Neutral
	}
}

// Bob decays from Supportive -> Neutral -> Skeptical
DISPOSITION_DECAY
{
	character = bob
	stepDays = 90

	STEP
	{
		from = Supportive
		to = Neutral
	}

	STEP
	{
		from = Neutral
		to = Skeptical
	}
}
