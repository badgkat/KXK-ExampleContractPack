// ============================================================================
// KAK Feature: KERBAL_ADMIN_KIT (global settings)
//
// Demonstrates:
//   - replaceAdminBuilding = true (Harmony-patches the Administration click)
//   - deskMemoCount (max memos shown on Desk panel)
//   - memoPollSeconds (condition evaluation interval)
//
// KAK Feature: DIRECTOR_PR_CAMPAIGN
//
// Demonstrates:
//   - PR Campaign button on the Desk panel
//   - baseCost + tierCostMultiplier (cost scales with reputation tier)
//   - haltDecayDays (pauses disposition decay when used)
//   - repBonus (reputation awarded on use)
//   - cooldownDays (minimum wait between uses)
// ============================================================================

KERBAL_ADMIN_KIT
{
	// When true, clicking the Administration building opens the KAK
	// three-panel admin window instead of the stock strategies UI
	replaceAdminBuilding = true

	// Maximum memos visible on the Desk panel at once
	deskMemoCount = 5

	// How often (in-game seconds) memo conditions are re-evaluated
	memoPollSeconds = 5
}

DIRECTOR_PR_CAMPAIGN
{
	// Cost = baseCost + (tierCostMultiplier * currentTierIndex)
	baseCost = 25000
	tierCostMultiplier = 10000

	// Pauses disposition decay for this many in-game days after use
	haltDecayDays = 30

	// Reputation points awarded when PR Campaign is executed
	repBonus = 5

	// Minimum in-game days between uses
	cooldownDays = 15
}
