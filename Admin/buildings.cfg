// ============================================================================
// KAK Feature: DIRECTOR_BUILDING_SCENE
//
// Demonstrates:
//   - Character chip overlay in Mission Control
//   - Character chip overlay in Tracking Station
//   - onClickScene (fires KDK dialogue when chip is clicked)
//
// KAK Feature: DIRECTOR_NOTIFICATION_STYLE
//
// Demonstrates:
//   - Custom notification marker appearance per severity level
//   - color tinting
//   - pulse animation (gentle scale oscillation)
//
// KAK Feature: DIRECTOR_KSC_MARKER_OFFSET
//
// Demonstrates:
//   - Fine-tuning marker position over KSC buildings
//   - x/y pixel offsets from building center
// ============================================================================

// --- Building Scene: Bob in Mission Control ---
// When Mission Control is open, Bob's chip appears in the top-right overlay.
// Clicking the chip fires the chapter 2 dialogue.
DIRECTOR_BUILDING_SCENE
{
	facility = MissionControl
	character = bob
	onClickScene = kxk_example_chapter2
}

// --- Building Scene: Alice in Tracking Station ---
// When the Tracking Station scene is active, Alice's chip appears.
DIRECTOR_BUILDING_SCENE
{
	facility = TrackingStation
	character = alice
	onClickScene = kxk_example_welcome
}

// --- Notification Style: Info ---
// Low-urgency marker. No pulse.
DIRECTOR_NOTIFICATION_STYLE
{
	severity = Info
	color = #66AAFF
	pulse = false
}

// --- Notification Style: Action ---
// Higher-urgency marker with pulse animation to draw attention.
DIRECTOR_NOTIFICATION_STYLE
{
	severity = Action
	color = #FFAA33
	pulse = true
}

// --- Marker Offsets ---
// Adjust where notification icons float relative to building centers.
// x = horizontal offset (pixels), y = vertical offset (pixels)
DIRECTOR_KSC_MARKER_OFFSET
{
	building = Administration
	x = 0
	y = 25
}

DIRECTOR_KSC_MARKER_OFFSET
{
	building = MissionControl
	x = 5
	y = 20
}
