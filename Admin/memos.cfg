// ============================================================================
// KAK Feature: DIRECTOR_MEMO
//
// Demonstrates:
//   - Single condition (no composite wrapper needed)
//   - ALL composite (all conditions must be true)
//   - ANY composite (at least one condition must be true)
//   - Nested ALL/ANY composites
//   - Condition types: FundsBelow, ReputationAbove, ReputationBelow,
//     InChapter, ChapterAtLeast, FlagExpression
//   - priority = High (requires two clicks to dismiss)
//   - suppressAfterDismiss = true (never re-fires after dismissal)
//   - suppressAfterDismiss = false (re-fires on next rising edge)
//   - postToStockMail = true (mirrors to KSP inbox on first activation)
//   - expireAfterDays (auto-expires after N in-game days)
// ============================================================================

// --- Memo 1: Low Funds Warning ---
// Single condition, no composite needed. High priority, re-arming.
DIRECTOR_MEMO
{
	id = kxk_memo_lowfunds
	character = alice
	text = <b>Warning:</b> Funds are critically low. Consider accepting contracts or running a PR Campaign.

	// High priority = red "!" badge, requires two clicks to dismiss
	priority = High

	// false = memo re-fires when condition goes true again after dismissal
	suppressAfterDismiss = false

	// Single condition — no ALL/ANY wrapper required
	CONDITION
	{
		type = FundsBelow
		threshold = 5000
	}
}

// --- Memo 2: Chapter 2 Congratulations ---
// ALL composite (both conditions must be true). Suppressed after dismiss, posts to stock mail.
DIRECTOR_MEMO
{
	id = kxk_memo_ch2
	character = bob
	text = Congratulations — the program has entered its orbital phase. New contracts are available in Mission Control.
	priority = Normal

	// true = once dismissed, this memo never fires again in this save
	suppressAfterDismiss = true

	// true = memo also appears in KSP's stock message inbox on first activation
	postToStockMail = true

	// ALL = every nested condition must be true
	ALL
	{
		CONDITION
		{
			type = ChapterAtLeast
			chapter = 2
		}

		CONDITION
		{
			type = FlagExpression
			expression = kxk_orbit_phase == true
		}
	}
}

// --- Memo 3: Science Approach Memo ---
// ANY composite (at least one condition true). Auto-expires after 30 days.
DIRECTOR_MEMO
{
	id = kxk_memo_science
	character = alice
	text = The science-first approach is paying off, or our reputation is growing. Either way, good news.
	priority = Normal

	// Memo automatically deactivates after 30 in-game days
	expireAfterDays = 30

	// ANY = at least one nested condition must be true
	ANY
	{
		CONDITION
		{
			type = FlagExpression
			expression = approach == science
		}

		CONDITION
		{
			type = ReputationAbove
			threshold = 50
		}
	}
}

// --- Memo 4: Orbit Reminder ---
// Nested ALL/ANY composite demonstrating complex condition logic.
DIRECTOR_MEMO
{
	id = kxk_memo_orbit_reminder
	character = bob
	text = We are in the orbital phase but resources are getting tight. Check the contracts board or run a PR Campaign.
	priority = Normal

	// Outer ALL: both the chapter check AND the resource check must be true
	ALL
	{
		CONDITION
		{
			type = InChapter
			chapter = 2
		}

		// Inner ANY: at least one resource is low
		ANY
		{
			CONDITION
			{
				type = FundsBelow
				threshold = 20000
			}

			CONDITION
			{
				type = ReputationBelow
				threshold = 30
			}
		}
	}
}
