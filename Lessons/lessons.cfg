// ============================================================================
// KIK Feature: INSTRUCTION_LESSON
//
// Demonstrates:
//   - id, title, category, tags, sortOrder
//   - PAGE with text only
//   - PAGE with image + caption
//   - PAGE with LINK nodes (type = lesson, kspedia, url)
//   - visibleIf with .unlocked atom (lesson unlock state)
//   - visibleIf with .set atom (custom flag state)
//   - visibleIf with && operator combining both
//
// KIK Feature: LESSON_TRIGGER
//
// Demonstrates:
//   - onGameStart = true (unlocks on new game)
//   - onContract + state (unlocks on contract state change)
//   - onFlag (unlocks when KDK flag is set to true)
//
// KIK Feature: KIK_CONTRACT_LESSON
//
// Demonstrates:
//   - Automatic "View Instructions" link in Mission Control contract panel
//   - contract + lesson binding
//   - unlockOn state (OFFERED, ACCEPTED)
//   - showButton = true
// ============================================================================

// =====================================================================
// Lesson 1: Welcome — unlocked on game start
// =====================================================================

INSTRUCTION_LESSON
{
	id = KXK_LSN_Welcome
	title = Welcome to the Example Pack
	category = KXK Examples
	tags = intro, basics
	sortOrder = 1
	// No visibleIf — always visible once unlocked

	// --- Page 1: text only ---
	PAGE
	{
		title = Overview
		text = This lesson pack demonstrates KerbalInstructionsKit features.\n\nIt includes multiple pages, images, and links to other lessons, KSPedia articles, and external URLs.\n\nUse the Next/Prev buttons to navigate.
	}

	// --- Page 2: image with caption ---
	PAGE
	{
		title = Image Example
		// image path uses KSP GameDatabase path format (no .png extension)
		image = KXK-ExampleContractPack/Textures/badgkat_icon
		caption = The BadgKat icon — demonstrating image support in lesson pages.
	}

	// --- Page 3: text with links ---
	PAGE
	{
		title = Navigation Links
		text = Lessons can link to other lessons, KSPedia articles, and external URLs.

		// LINK type = lesson: navigates to another lesson by id
		// Disabled if target lesson is not yet unlocked
		LINK
		{
			type = lesson
			target = KXK_LSN_Launch
			label = Go to Launch Lesson
		}

		// LINK type = kspedia: opens a KSPedia article
		LINK
		{
			type = kspedia
			target = staging
			label = Open KSPedia: Staging
		}

		// LINK type = url: opens an external URL in system browser
		// Note: use backslashes in cfg, KIK converts to forward slashes
		LINK
		{
			type = url
			target = https:\wiki.kerbalspaceprogram.com
			label = KSP Wiki
		}
	}
}

// =====================================================================
// Lesson 2: Launch — unlocked when DemoLaunch contract is offered
// =====================================================================

INSTRUCTION_LESSON
{
	id = KXK_LSN_Launch
	title = Your First Launch
	category = KXK Examples
	tags = launch, rockets
	sortOrder = 2

	// visibleIf with .unlocked atom:
	// This lesson only appears in the archive if the Welcome lesson is unlocked
	visibleIf = KXK_LSN_Welcome.unlocked

	PAGE
	{
		title = Getting Off the Ground
		text = Your first contract is to reach 10 km altitude.\n\nBuild a simple rocket in the VAB and launch it. You do not need to reach orbit yet — just get above 10 km.
	}

	PAGE
	{
		title = Next Steps
		text = After completing the launch, the program advances to Chapter 2 and orbital contracts become available.

		LINK
		{
			type = lesson
			target = KXK_LSN_Orbit
			label = Go to Orbit Lesson
		}

		LINK
		{
			type = url
			target = https:\wiki.kerbalspaceprogram.com
			label = KSP Wiki
		}
	}
}

// =====================================================================
// Lesson 3: Orbit — unlocked by KCK flag trigger
// =====================================================================

INSTRUCTION_LESSON
{
	id = KXK_LSN_Orbit
	title = Reaching Orbit
	category = KXK Examples
	tags = orbit, advanced
	sortOrder = 3

	// visibleIf combining .unlocked and .set atoms with && operator:
	// Visible only if the Launch lesson is unlocked AND the orbit_training flag is set
	visibleIf = KXK_LSN_Launch.unlocked && orbit_training.set

	PAGE
	{
		title = Orbital Mechanics
		text = To reach orbit, you need enough horizontal velocity that you fall around the planet instead of back to the surface.\n\nBurn east (90 degrees heading) and raise your apoapsis above 70 km, then circularize.
	}

	PAGE
	{
		title = Further Reading
		text = This is the final lesson in the example pack. It links back to the welcome lesson to demonstrate circular navigation.

		// Circular link back to the first lesson
		LINK
		{
			type = lesson
			target = KXK_LSN_Welcome
			label = Back to Welcome
		}
	}
}

// =====================================================================
// Triggers
// =====================================================================

// --- LESSON_TRIGGER: onGameStart ---
// Unlocks the Welcome lesson immediately on new game
LESSON_TRIGGER
{
	lesson = KXK_LSN_Welcome
	onGameStart = true
}

// --- LESSON_TRIGGER: onContract + state ---
// Unlocks the Launch lesson when the DemoLaunch contract is offered
LESSON_TRIGGER
{
	lesson = KXK_LSN_Launch
	onContract = KXK_DemoLaunch
	state = OFFERED
}

// --- LESSON_TRIGGER: onFlag ---
// Unlocks the Orbit lesson when the "orbit_training" flag is set to true
// (this flag is set by a KCK trigger in triggers.cfg when chapter 2 begins)
LESSON_TRIGGER
{
	lesson = KXK_LSN_Orbit
	onFlag = orbit_training
}

// =====================================================================
// Contract-Lesson Bindings (CC Integration)
// =====================================================================

// --- KIK_CONTRACT_LESSON: DemoLaunch ---
// Injects "View Instructions" link into Mission Control contract detail panel
KIK_CONTRACT_LESSON
{
	contract = KXK_DemoLaunch
	lesson = KXK_LSN_Launch

	// unlockOn = OFFERED means the lesson unlocks when the contract appears
	unlockOn = OFFERED

	// showButton = true adds the "View Instructions" link in Mission Control
	showButton = true
}

// --- KIK_CONTRACT_LESSON: DemoOrbit ---
KIK_CONTRACT_LESSON
{
	contract = KXK_DemoOrbit
	lesson = KXK_LSN_Orbit

	// unlockOn = ACCEPTED means the lesson unlocks when the player accepts
	unlockOn = ACCEPTED
	showButton = true
}
