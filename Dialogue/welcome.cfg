// ============================================================================
// KDK Feature: DIALOGUE_SCENE
//
// Demonstrates:
//   - DIALOGUE_SCENE with id and title
//   - CHARACTER nodes (2 slots: A and B) with name, model, color
//   - LINE nodes with speaker, text, animation
//   - CHOICE node with OPTION children (value, text, description)
//   - visibleIf on LINE nodes using == operator for flag-gated branching
//   - Common (ungated) lines after branching section
//
// The choice sets flag "approach" to the selected option's value.
// Post-choice lines use visibleIf to branch on that flag.
// ============================================================================

DIALOGUE_SCENE
{
	id = kxk_example_welcome
	title = Welcome to the Program

	// --- Character A: Alice (Program Director) ---
	// model = Instructor_Wernher uses the Wernher von Kerman instructor portrait
	// color uses #AARRGGBB hex format (alpha, red, green, blue)
	CHARACTER
	{
		id = A
		name = Alice
		model = Instructor_Wernher
		color = #FF6699CC
	}

	// --- Character B: Bob (Lead Engineer) ---
	CHARACTER
	{
		id = B
		name = Bob
		model = Instructor_Gene
		color = #FFCC9966
	}

	// --- Opening lines (no visibleIf = always shown) ---

	LINE
	{
		speaker = A
		text = Welcome to the KXK Example Program. I am Alice, your Program Director.
		animation = idle
	}

	LINE
	{
		speaker = B
		text = And I am Bob, Lead Engineer. We are here to demonstrate every feature of the KXK toolkit.
		animation = idle
	}

	LINE
	{
		speaker = A
		text = First, a decision. This choice will set the "approach" flag and gate later content.
	}

	// --- CHOICE node ---
	// id = the flag name that gets set to the chosen option's value
	// Each OPTION has: value (written to flag), text (button label), description (below button)
	CHOICE
	{
		id = approach
		prompt = How should we focus the program?

		OPTION
		{
			value = science
			text = Science First
			description = Prioritize data collection and research.
		}

		OPTION
		{
			value = exploration
			text = Exploration First
			description = Push boundaries and explore the unknown.
		}

		OPTION
		{
			value = balanced
			text = Balanced Approach
			description = A mix of science and exploration.
		}
	}

	// --- Branching lines gated by visibleIf ---
	// Only the line matching the player's choice is shown.

	LINE
	{
		speaker = A
		visibleIf = approach == science
		text = Science it is. Wernher would approve. We will prioritize experiments on every mission.
	}

	LINE
	{
		speaker = A
		visibleIf = approach == exploration
		text = Exploration it is. Bold choice. We will push further and faster.
	}

	LINE
	{
		speaker = A
		visibleIf = approach == balanced
		text = A balanced approach. Sensible. We will do a bit of everything.
	}

	// --- Common closing line (no visibleIf = always shown) ---

	LINE
	{
		speaker = B
		text = Whatever the approach, our first task is the same — get something off the ground.
	}
}
