// ============================================================================
// KDK Feature: DIALOGUE_SCENE (second scene)
//
// Demonstrates:
//   - Flag persistence: reads "approach" flag set in welcome scene
//   - visibleIf with != operator
//   - visibleIf with "in" operator (membership test)
//   - Reusing same CHARACTER definitions across scenes
// ============================================================================

DIALOGUE_SCENE
{
	id = kxk_example_chapter2
	title = Orbital Operations Begin

	CHARACTER
	{
		id = A
		name = Alice
		model = Instructor_Wernher
		color = #FF6699CC
	}

	CHARACTER
	{
		id = B
		name = Bob
		model = Instructor_Gene
		color = #FFCC9966
	}

	LINE
	{
		speaker = A
		text = Chapter 2 — we have proven we can fly. Now it is time for orbit.
	}

	// --- visibleIf with != operator ---
	// This line only appears if the player did NOT choose "balanced"
	LINE
	{
		speaker = B
		visibleIf = approach != balanced
		text = You picked a clear direction last time. That will shape what comes next.
	}

	// --- visibleIf with "in" operator ---
	// Matches if "approach" flag is any of the listed values
	LINE
	{
		speaker = A
		visibleIf = approach in (science, exploration)
		text = Whether it was science or exploration, orbital capability unlocks both.
	}

	LINE
	{
		speaker = B
		text = Time to reach orbit. The contract is on the board.
	}
}
